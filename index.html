<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Joue avec moi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap">
<style>
  /* Plein écran = caméra frontale ; en bas, un tableau givré où l'on touche la bonne réponse. */
  :root { --vert: #22C55E; --rouge: #EF4444; --jaune: #FFE53B; --verre: rgba(255,255,255,.2); --bord-verre: rgba(255,255,255,.45);
    --carte: rgba(255,255,255,.9); --police: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; color: #fff; overflow: hidden; font-family: var(--police);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #1b1b22; }
  #sans-cam { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 20%, #3a3a4a, #101014); display: none; }
  body.sans-camera #sans-cam { display: block; }
  /* texte au contour noir, comme ses scores (Montserrat Black, contour ≈ 7,5 %) */
  .contour { font-weight: 900; text-transform: uppercase; -webkit-text-stroke: .075em #000; paint-order: stroke fill;
    text-shadow: .04em .06em .12em rgba(0,0,0,.45); }

  #haut { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #titre-jeu { font-size: min(9.4vw, 46px); line-height: 1; text-align: center; font-style: italic; }
  #compte { font-size: min(6vw, 28px); color: var(--jaune); pointer-events: auto; padding: 4px 12px; }

  /* le tableau ne dépasse jamais l'écran : sur un écran large (Mac, iPad couché) il reste centré et la grille tient en hauteur */
  #tableau { position: fixed; left: 0; right: 0; margin: 0 auto; width: min(calc(100% - 24px), 640px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: var(--verre); border: 1.5px solid var(--bord-verre); border-radius: 28px; padding: 14px;
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5); display: none; }
  body.en-jeu #tableau { display: block; }
  #nom { text-align: center; font-size: min(5.6vw, 26px); min-height: 1.3em; margin-bottom: 10px; opacity: 0; transition: opacity .25s; }
  #tableau.repondu #nom { opacity: 1; }
  #tableau.penalite #nom { opacity: 1; color: var(--rouge); }

  /* Trouve le bon logo : 2 cartes côte à côte */
  #logos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, calc(2 * (100vh - 230px))); margin: 0 auto; }
  .choix { position: relative; aspect-ratio: 1; background: var(--carte); border-radius: 20px; border: 5px solid transparent;
    transition: transform .3s cubic-bezier(.3,1.6,.5,1), opacity .3s, border-color .2s; }
  .choix img { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: contain; pointer-events: none; }
  .choix .lettre { position: absolute; left: 10px; top: 6px; color: #111; font-weight: 900; font-size: min(5vw, 22px); opacity: .35; }

  /* Trouve l'intrus : grille d'emoji */
  #grille { display: grid; gap: 0; background: var(--carte); border-radius: 18px; padding: 6px; aspect-ratio: 1; width: min(100%, calc(100vh - 210px)); margin: 0 auto; }
  #grille > div { position: relative; display: flex; align-items: center; justify-content: center; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; border-radius: 50%;
    transition: opacity .25s, transform .3s cubic-bezier(.3,1.6,.5,1); }
  #tableau.repondu #grille > div:not(.bon):not(.faux) { opacity: .15; }

  /* réponses */
  .bon { border-color: var(--vert) !important; transform: scale(1.06); }
  #grille > .bon { box-shadow: 0 0 0 .32em var(--vert); transform: scale(1.35); z-index: 1; background: #fff; }
  .faux { border-color: var(--rouge) !important; animation: tremble .4s; }
  #grille > .faux { box-shadow: 0 0 0 .28em var(--rouge); }
  #tableau.repondu .choix:not(.bon):not(.faux) { opacity: .35; }
  .pastille { position: absolute; right: -8px; top: -8px; width: 42px; height: 42px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: #fff; border: 3px solid #000;
    animation: pop .3s cubic-bezier(.3,1.8,.5,1); z-index: 2; }
  #grille .pastille { width: 1.3em; height: 1.3em; font-size: .9em; right: -.5em; top: -.6em; border-width: 2px; }
  .bon .pastille { background: var(--vert); }
  .faux .pastille { background: var(--rouge); }
  /* jeux à la voix : .bon/.faux posés sur le BLOC entier -> pas de ×1,06 ni de tremblement du bloc (ça dépassait du cadre) */
  #vf.bon, #vf.faux, #mot.bon, #mot.faux { transform: none; animation: none; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes tremble { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }

  /* Retrouve la star : photo à l'envers, on dit le nom à voix haute -> elle se retourne */
  #star { position: relative; width: min(72vw, calc(100vh - 250px), 440px); aspect-ratio: 1; margin: 0 auto; }
  #star img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px; border: 5px solid #fff;
    transform: rotate(180deg); transition: transform .6s cubic-bezier(.5,1.5,.5,1), border-color .2s; }
  #star.bon img, #star.faux img { transform: rotate(0deg); }
  #star.bon img { border-color: var(--vert); }
  #star.faux img { border-color: var(--rouge); }
  #star .pastille { right: -12px; top: -12px; width: 52px; height: 52px; font-size: 30px; }

  /* Retrouve le mot : tuiles noires (mot mélangé) -> vertes (trouvé) ou rouges (raté), comme sa pastille */
  #mot { display: flex; gap: var(--g); justify-content: center; padding: 18px 0; }
  #mot span { flex: none; width: var(--t); height: calc(var(--t) * 1.3); display: flex; align-items: center; justify-content: center;
    background: #111; color: #fff; border-radius: calc(var(--t) * .16); font-weight: 900; font-size: calc(var(--t) * .8);
    box-shadow: 0 4px 0 rgba(0,0,0,.45); transition: background .2s; }
  #mot.bon span { background: var(--vert); animation: tombe .32s cubic-bezier(.3,1.4,.5,1) backwards; }
  #mot.faux span { background: var(--rouge); animation: tombe .32s cubic-bezier(.3,1.4,.5,1) backwards; }
  /* les lettres tombent en place : aucun grossissement, donc rien ne dépasse du cadre */
  @keyframes tombe { from { transform: translateY(-40%); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Vrai ou faux : UN logo, on dit (ou touche) vrai / faux ; si c'était un faux, le vrai apparaît à côté */
  #vf { width: min(80vw, calc(100vh - 300px), 460px); }
  /* le cadre garde TOUJOURS la même taille : si c'était un faux, la carte glisse à gauche en rétrécissant et le vrai
     arrive à droite (transformations seulement, rien ne bouge dans la mise en page) */
  #vf-logos { position: relative; width: 100%; aspect-ratio: 1; }
  .carte-vf { position: absolute; inset: 0; background: var(--carte); border-radius: 20px; border: 5px solid transparent;
    transition: transform .5s cubic-bezier(.3,1.25,.5,1), opacity .3s, border-color .2s; }
  .carte-vf img { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: contain; }
  #carte-reel { opacity: 0; transform: translateX(26%) scale(.2); border-color: var(--vert); }
  #vf.montre-reel #carte-vf { transform: translateX(-26%) scale(.48); }
  #vf.montre-reel #carte-reel { opacity: 1; transform: translateX(26%) scale(.48); transition-delay: .12s; }
  #etiquette-vrai { position: absolute; left: 52%; right: 0; top: 12%; text-align: center; font-size: min(4.6vw, 22px); color: var(--vert);
    opacity: 0; transition: opacity .3s .35s; }
  #etiquette-faux { position: absolute; left: 0; right: 52%; top: 12%; text-align: center; font-size: min(4.6vw, 22px); color: var(--rouge);
    opacity: 0; transition: opacity .3s .35s; }
  #vf.montre-reel #etiquette-vrai, #vf.montre-reel #etiquette-faux { opacity: 1; }
  #vf.bon #carte-vf { border-color: var(--vert); }
  #vf.faux #carte-vf, #vf.montre-reel #carte-vf { border-color: var(--rouge); }
  #vf.faux:not(.montre-reel) #carte-vf { animation: tremble .4s; }
  #vf.montre-reel #carte-vf .pastille { scale: 2; transform-origin: 100% 0; }   /* la carte est à ×0,48 : la pastille garde sa taille */
  /* remise à zéro entre deux logos : sans transition, sinon on voit la carte « revenir » */
  #vf.sec .carte-vf, #vf.sec #etiquette-vrai, #vf.sec #etiquette-faux { transition: none !important; }
  #boutons-vf { display: flex; gap: 12px; margin-top: 12px; }
  #boutons-vf button { flex: 1; font: 900 min(6vw, 26px) var(--police); text-transform: uppercase; color: #fff; border: 3px solid #000;
    border-radius: 16px; padding: 12px 6px; -webkit-text-stroke: .06em #000; paint-order: stroke fill; }
  #boutons-vf [data-v="1"] { background: var(--vert); }
  #boutons-vf [data-v="0"] { background: var(--rouge); }
  #vf.bon #boutons-vf, #vf.faux #boutons-vf { visibility: hidden; }
  #vf .pastille { right: -10px; top: -10px; }

  /* jeux à la voix (star, mot, vrai/faux) : jauge de temps sous le jeu, ce qu'il entend au-dessus du tableau */
  #barre { display: none; height: 10px; margin: 10px 6px 2px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; }
  body.voix #barre { display: block; }
  #tableau.repondu #barre, #tableau.fini #barre { visibility: hidden; }
  #barre i { display: block; height: 100%; width: 100%; background: var(--jaune); transform-origin: left; }
  body.voix #tableau { width: fit-content; max-width: calc(100% - 24px); padding: 8px; border-radius: 24px; }
  body.voix #nom { position: absolute; left: 0; right: 0; bottom: 100%; margin: 0 0 8px; opacity: 1; }
  body.voix #fin { width: min(72vw, 440px); }
  #nom.entendu { font-size: min(4.4vw, 20px); opacity: .85 !important; text-transform: none; }
  #nom.vert { color: var(--vert); }
  #nom.rouge { color: var(--rouge); }
  #tableau.fini #star, #tableau.fini #mot, #tableau.fini #vf { display: none !important; }
  /* micro : petit point en haut à droite (rouge = il écoute, gris = coupé, touche l'écran pour le relancer) */
  #micro { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); width: 14px; height: 14px; border-radius: 50%;
    background: #777; border: 2px solid #000; display: none; }
  body.voix.en-jeu #micro { display: block; }
  #micro.on { background: var(--rouge); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* fin de manche */
  #fin { text-align: center; padding: 18px 8px 22px; display: none; }
  /* Trouve l'intrus : tableau serré autour de la grille (sans ligne vide au-dessus) pour laisser la tête visible ;
     le « +2 s » flotte au-dessus du tableau */
  body.mode-intrus #tableau { width: fit-content; max-width: calc(100% - 24px); padding: 8px; border-radius: 24px; }
  body.mode-intrus #nom { position: absolute; left: 0; right: 0; bottom: 100%; margin: 0 0 8px; }
  body.mode-intrus #grille { width: min(80vw, calc(100vh - 210px), 520px); }
  body.mode-intrus #fin { width: min(80vw, 520px); }
  #tableau.fini #fin { display: block; }
  #tableau.fini #logos, #tableau.fini #grille, #tableau.fini #nom { display: none; }
  #fin b { display: block; font-size: min(22vw, 110px); line-height: 1; }
  #fin span { display: block; font-size: min(6.4vw, 30px); margin-top: 8px; }

  /* écran « prêt » (le temps de lancer l'enregistrement d'écran) */
  #pret { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-size: min(7vw, 34px); line-height: 1.2; }
  body.pret #pret { display: flex; }

  /* menu */
  #menu { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 460px; margin: 0 auto;
    background: rgba(20,20,26,.72); border: 1.5px solid var(--bord-verre); border-radius: 28px; padding: 22px 18px;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: flex; flex-direction: column; gap: 16px; }
  body.en-jeu #menu, body.pret #menu { display: none; }
  #menu h2 { font-size: 30px; text-align: center; font-style: italic; }
  #menu p { font-size: 14px; font-weight: 700; color: #cfcfd6; text-align: center; line-height: 1.4; }
  .ligne { display: flex; gap: 8px; }
  .ligne button { flex: 1; font: 900 16px var(--police); text-transform: uppercase; color: #fff; background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.25); border-radius: 14px; padding: 14px 6px; }
  .ligne button.choisi { background: var(--jaune); color: #000; border-color: var(--jaune); }
  #go { font: 900 22px var(--police); text-transform: uppercase; background: var(--vert); color: #000; border: 0; border-radius: 16px; padding: 16px; }
</style>
</head>
<body class="sans-camera">
<video id="cam" autoplay playsinline muted></video>
<div id="sans-cam"></div>

<div id="haut">
  <div id="titre-jeu" class="contour"></div>
  <div id="compte" class="contour"></div>
</div>

<div id="tableau">
  <div id="nom" class="contour"></div>
  <div id="logos">
    <div class="choix" data-c="A"><span class="lettre">A</span><img id="imgA" alt=""></div>

  </div>

    <div id="vf-logos">
      <div class="carte-vf" id="carte-vf"><img id="imgVF" alt=""></div>
      <div class="carte-vf" id="carte-reel"><img id="imgReel" alt=""></div>
      <div id="etiquette-faux" class="contour">Le faux</div>
      <div id="etiquette-vrai" class="contour">Le vrai</div>
    </div>

  </div>

</div>

<div id="menu">
  <h2 class="contour">Joue avec moi</h2>
  <div class="ligne" id="choix-jeu">
    <button data-jeu="logo" class="choisi">Bon logo</button>
    <button data-jeu="intrus">Intrus</button>

  </div>

  <div class="ligne" id="choix-temps" style="display:none">
    <button data-t="5000">5 s</button>

  </div>

    <button data-m="0" class="choisi">Manche 1</button>

</div>

<script src="logos.js"></script>
<script src="stars.js"></script>

<script>
// Trouve l'intrus : [emoji de la grille, intrus]. À chaque partie on tire 8 paires dans cette réserve
// (en évitant celles de la partie d'avant), l'intrus tombe à une place au hasard, et un côté sur deux on inverse les rôles.
// Règle de tri (ses retours du 27-10) : UN petit détail seulement, jamais une couleur, un miroir ou un objet différent ; pas de mains (trop simple).
const RESERVE = [
  ["🙂", "🙃"], ["📪", "📫"], ["🐪", "🐫"], ["🇸🇳", "🇲🇱"], ["🕐", "🕜"], ["😞", "😔"], ["🔒", "🔓"],
  ["😀", "😁"], ["😐", "😑"], ["🔁", "🔂"], ["📁", "📂"], ["🇦🇹", "🇱🇻"], ["😺", "😸"], ["📃", "📄"], ["😗", "😙"],
  ["😃", "😄"], ["😗", "😚"], ["🕐", "🕑"], ["🇳🇱", "🇱🇺"], ["😮", "😯"], ["🙁", "☹️"], ["🔈", "🔉"],
  ["😕", "🫤"], ["😨", "😰"], ["😧", "😦"], ["🕗", "🕘"], ["😌", "😊"], ["🌤️", "⛅"],
  ["🕒", "🕞"], ["🕔", "🕕"], ["😙", "😚"], ["😶", "😐"], ["😯", "😦"], ["😒", "😑"], ["🇸🇮", "🇸🇰"], ["🇦🇺", "🇳🇿"],
];
const TAILLES = [6, 9, 12];
function tirerPaires(n) {
  let recentes = [];
  try { recentes = JSON.parse(localStorage.getItem("intrus-recentes") || "[]"); } catch (e) {}
  const cle = p => [...p].sort().join("|");   // même clé quel que soit le sens
  const melange = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const neuves = melange(RESERVE.filter(p => !recentes.includes(cle(p)))), vues = melange(RESERVE.filter(p => recentes.includes(cle(p))));
  const choix = [...neuves, ...vues].slice(0, n).map(p => Math.random() < .5 ? p : [p[1], p[0]]);
  try { localStorage.setItem("intrus-recentes", JSON.stringify(choix.map(cle).concat(recentes).slice(0, 24))); } catch (e) {}
  return choix;
}
const LOGOS = window.MANCHES;
const $ = id => document.getElementById(id);
const tableau = $("tableau");
let jeu = "logo", manche = 0, items = [], k = 0, bons = 0, verrou = false, suite;

// précharge les logos : aucune attente pendant l'enregistrement
LOGOS.forEach(m => m.logos.forEach(l => [l.a, l.b].forEach(src => { const i = new Image(); i.src = src; })));

async function camera() {
  if (document.body.classList.contains("camera-ok")) return;
  try {
    const flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $("cam").srcObject = flux;
    document.body.classList.replace("sans-camera", "camera-ok");
  } catch (e) { console.warn("caméra indisponible", e); }
}

// L'intrus tombe à chaque grille dans un quart différent, jamais deux fois sur la même case.
function grillesIntrus(m) {
  const n = m.taille, moitie = Math.ceil(n / 2), prises = new Set();
  let quarts = [];
  return m.paires.map(([fond, intrus]) => {
    if (!quarts.length) quarts = [0, 1, 2, 3].sort(() => Math.random() - .5);
    const q = quarts.pop(), droite = q % 2, bas = q > 1;
    let col, ligne;
    do {
      col = (droite ? moitie : 0) + Math.floor(Math.random() * (droite ? n - moitie : moitie));
      ligne = (bas ? moitie : 0) + Math.floor(Math.random() * (bas ? n - moitie : moitie));
    } while (prises.has(col + "," + ligne));
    prises.add(col + "," + ligne);
    return { fond, intrus, col, ligne, n };
  });
}

// Trouve l'intrus se joue au chrono : il tourne tant qu'une grille est à l'écran, une erreur coûte PENALITE.
const PENALITE = 2000;
let cumul = 0, depuis = null, boucle;
const temps = () => cumul + (depuis ? performance.now() - depuis : 0);
const format = ms => (ms / 1000).toFixed(1).replace(".", ",") + " s";
function chrono(marche) {
  if (marche && !depuis) depuis = performance.now();
  if (!marche && depuis) { cumul += performance.now() - depuis; depuis = null; }
}
function tic() { if (jeu === "intrus" && document.body.classList.contains("en-jeu")) compteur(); boucle = requestAnimationFrame(tic); }

// ---------- Jeux à la voix : Retrouve la star, Retrouve le mot, Vrai ou faux ----------
const VOIX = ["star", "mot", "vf"];
const aVoix = () => VOIX.includes(jeu);
let TEMPS = 10000;   // temps par question (menu : 5 / 10 / 15 s)
const PASSE = ["je passe", "passe", "suivant", "joker"];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
STARS.forEach(m => m.stars.forEach(s => { const i = new Image(); i.src = s.photo; }));

// on compare sans accents ni majuscules, mots collés (« inox tag » = « inoxtag »), avec une faute tolérée par ~5 lettres
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function lev(a, b) {
  let p = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const c = [i];
    for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[b.length];
}
// tolerance(longueur) = nombre de fautes acceptées ; par défaut celle des stars
function ditUnDe(texte, reponses, tolerance = l => l < 5 ? 0 : Math.floor(l * .22)) {
  const mots = norm(texte).split(" ").filter(Boolean);
  return reponses.some(r => {
    const cible = norm(r).replace(/ /g, ""), n = norm(r).split(" ").length, tol = tolerance(cible.length);
    for (let t = Math.max(1, n - 1); t <= n + 1; t++)
      for (let i = 0; i + t <= mots.length; i++)
        if (lev(mots.slice(i, i + t).join(""), cible) <= tol) return true;
    return false;
  });
}
// mot mélangé : le mot exact (au pluriel près), une faute seulement à partir de 8 lettres
const tolMot = l => l >= 8 ? 1 : 0;
const pluriel = m => [m, m + "s", m + "x"];
// vrai / faux : le dernier mot entendu décide (la dictée écrit parfois « faut » ou « vrais »)
const MOTS_VRAI = ["vrai", "vrais", "vraie", "c est vrai", "le vrai"], MOTS_FAUX = ["faux", "faut", "fausse", "fo", "c est faux", "le faux"];
const finitPar = (p, liste) => { const n = norm(p); return liste.some(x => n === x || n.endsWith(" " + x)); };

let reco = null, ecoute = false, refuse = false, abandon = false, derniers = null, deja = new Map(), finQ = 0, debutQ = 0, minuteQ, barre;
const GRACE = 600;   // vrai/faux et « je passe » : on n'écoute qu'après 0,6 s (le temps que la dictée finisse la phrase d'avant)
const motsDe = s => norm(s).split(" ").filter(Boolean);
// Ce qui a été dit avant la question actuelle ne compte pas (la reconnaissance tourne en continu).
// On retient les MOTS déjà entendus (pas le nombre de lettres) : l'iPhone réécrit souvent la phrase après coup
// (« vrai » -> « Vrai. » -> « C'est vrai »), et l'ancienne réponse ne doit pas ressortir à la question suivante.
function oublier() {
  deja = new Map();
  if (derniers) for (let i = 0; i < derniers.length; i++) {
    const alts = [];
    for (let a = 0; a < derniers[i].length; a++) alts.push(motsDe(derniers[i][a].transcript));
    deja.set(i, alts);
  }
}
// mots dits depuis le début de la question, pour une phrase qui existait peut-être déjà avant
function nouveaux(courant, avant) {
  const c = motsDe(courant);
  if (!avant || !avant.length) return c;
  let p = 0;
  while (p < avant.length && p < c.length && c[p] === avant[p]) p++;
  if (p === avant.length) return c.slice(p);                    // la phrase a juste continué
  // phrase réécrite : on se cale sur le dernier mot déjà entendu (même nombre d'occurrences), sinon sur le nombre de mots
  const der = avant[avant.length - 1], fois = avant.filter(w => w === der).length;
  for (let i = 0, vus = 0; i < c.length; i++) if (c[i] === der && ++vus === fois) return c.slice(i + 1);
  return c.slice(Math.min(avant.length, c.length));
}
function micro() {
  if (!SR || ecoute) return;
  if (!reco) {
    reco = new SR();
    reco.lang = "fr-FR"; reco.continuous = true; reco.interimResults = true; reco.maxAlternatives = 3;
    reco.onstart = () => { ecoute = true; abandon = false; derniers = null; deja = new Map(); $("micro").classList.add("on"); };
    reco.onend = () => { ecoute = false; $("micro").classList.remove("on");
      if (!refuse && aVoix() && document.body.classList.contains("en-jeu")) setTimeout(micro, 150); };
    reco.onerror = e => { console.warn("reconnaissance", e.error);
      if ((e.error === "not-allowed" || e.error === "service-not-allowed") && !verrou) { refuse = true;
        $("nom").textContent = "Micro / dictée refusés : Réglages > Safari > Micro, et active Dictée"; $("nom").className = "contour entendu"; } };
    reco.onresult = e => { if (abandon) return; derniers = e.results; entendre(); };   // rien de l'ancienne session
  }
  try { reco.start(); } catch (e) {}
}
function couperMicro() { if (reco && ecoute) { abandon = true; try { reco.abort(); } catch (e) {} } }
// tests sans micro : __dit ajoute une phrase à la session, __reecrit remplace la dernière (comme la dictée qui se corrige)
window.__dit = texte => { derniers = [...(derniers || []), [{ transcript: texte }]]; entendre(); };
window.__reecrit = texte => { derniers = [...(derniers || []).slice(0, -1), [{ transcript: texte }]]; entendre(); };

function entendre() {
  const it = items[k]; if (!aVoix() || !it || verrou || !derniers) return;
  const phrases = [], principales = [];   // principales = la version la plus probable de chaque phrase, dans l'ordre
  for (let i = 0; i < derniers.length; i++) {
    const r = derniers[i], avant = deja.get(i);
    for (let a = 0; a < r.length; a++) {
      const neuf = nouveaux(r[a].transcript, avant && (avant[a] || avant[0])).join(" ");
      phrases.push(neuf);
      if (a === 0 && neuf) principales.push(neuf);
    }
  }
  const vu = principales.join(" ");
  if (vu) { $("nom").textContent = "« " + vu + " »"; $("nom").className = "contour entendu"; }
  if (jeu === "star" && phrases.some(p => ditUnDe(p, it.ok))) return reveler(true);
  if (jeu === "mot" && phrases.some(p => ditUnDe(p, pluriel(it.mot), tolMot))) return reveler(true);
  if (performance.now() - debutQ < GRACE) return;
  if (jeu === "vf" && principales.length) {
    // seul le dernier mot dit compte : « vrai… non faux » = faux
    const p = principales[principales.length - 1];
    if (finitPar(p, MOTS_VRAI)) return reveler(it.vrai === true, true, true);
    if (finitPar(p, MOTS_FAUX)) return reveler(it.vrai === false, true, true);
  }
  if (phrases.some(p => finitPar(p, PASSE))) return reveler(false, false, true);
}

// ok = bonne réponse ; repondu = il a donné une réponse (vrai/faux), sinon temps écoulé ou « je passe »
// neuve = repartir d'une session de dictée neuve (le micro se relance tout seul pendant la révélation, ~1,5 s)
function reveler(ok, repondu, neuve) {
  if (verrou) return;
  verrou = true; clearTimeout(minuteQ); cancelAnimationFrame(barre);
  if (neuve || jeu === "vf") couperMicro();
  if (ok) bons++;
  const it = items[k];
  if (jeu === "star") {
    const st = $("star"); st.classList.add(ok ? "bon" : "faux"); pastille(st, ok);
    $("nom").textContent = it.nom; $("nom").className = "contour " + (ok ? "vert" : "rouge");
  } else if (jeu === "mot") {
    tuiles(it.mot, ok ? "bon" : "faux");
    $("nom").textContent = ""; $("nom").className = "contour";
  } else {
    const v = $("vf"); v.classList.add(ok ? "bon" : "faux"); pastille($("carte-vf"), ok);
    if (!it.vrai) v.classList.add("montre-reel");
    $("nom").textContent = (it.vrai ? "C'était le vrai" : "C'était un faux") + (!repondu ? " · trop tard" : "");
    $("nom").className = "contour " + (ok ? "vert" : "rouge");
  }
  tableau.classList.add("repondu");
  compteur();
  suite = setTimeout(() => { k++; afficher(); }, jeu === "vf" && !it.vrai ? 2200 : ok ? 1500 : 2000);
}
// tuiles du mot (accents retirés, comme sa pastille) ; taille selon la longueur
function tuiles(mot, etat) {
  const lettres = [...mot.normalize("NFD").replace(/[̀-ͯ]/g, "")];
  const m = $("mot"); m.className = etat || "";
  // la rangée prend toute la largeur dispo (écran - marges du tableau) ; espaces serrés pour les mots longs
  // largeur intérieure réelle du cadre (écran - 12 px de chaque côté - bordure et marge du tableau) moins 16 px de respiration
  const n = lettres.length, g = n > 9 ? 3 : 5, W = Math.min(innerWidth - 24 - 19 - 16, 600);
  m.style.setProperty("--g", g + "px");
  m.style.setProperty("--t", Math.min(60, (W - g * (n - 1)) / n) + "px");
  m.innerHTML = lettres.map((l, i) => `<span style="animation-delay:${i * 35}ms">${l}</span>`).join("");
}
function afficherVoix(it) {
  $("nom").textContent = ""; $("nom").className = "contour";
  if (jeu === "star") {
    const st = $("star"); st.className = ""; st.querySelector(".pastille")?.remove();
    $("imgStar").src = it.photo;
  } else if (jeu === "mot") {
    tuiles(it.melange);
  } else {
    const v = $("vf");
    v.className = "sec"; $("carte-vf").querySelector(".pastille")?.remove();
    $("imgVF").src = it.src; $("imgReel").src = it.reel;
    void v.offsetWidth;                          // applique la remise à zéro sans animation…
    requestAnimationFrame(() => requestAnimationFrame(() => v.classList.remove("sec")));   // …puis réactive les transitions
  }
  oublier();
  debutQ = performance.now();
  finQ = debutQ + TEMPS;
  minuteQ = setTimeout(() => reveler(false), TEMPS);
  const jauge = $("barre").firstElementChild;
  const anim = () => { jauge.style.transform = `scaleX(${Math.max(0, (finQ - performance.now()) / TEMPS)})`; barre = requestAnimationFrame(anim); };
  anim();
  micro();
}
// Vrai ou faux : les 12 logos de la manche, 6 montrés en vrai et 6 en faux, dans un ordre mélangé
function questionsVF(logos) {
  const vrais = logos.map((_, i) => i < logos.length / 2).sort(() => Math.random() - .5);
  return logos.map((l, i) => {
    const reel = l.bon === "A" ? l.a : l.b, faux = l.bon === "A" ? l.b : l.a;
    return { nom: l.nom, vrai: vrais[i], src: vrais[i] ? reel : faux, reel };
  }).sort(() => Math.random() - .5);
}
$("boutons-vf").addEventListener("pointerdown", e => {
  const b = e.target.closest("button"); if (!b || jeu !== "vf" || verrou || !items[k]) return;
  reveler(items[k].vrai === (b.dataset.v === "1"), true);
});

function compteur() {
  const rang = Math.min(k + 1, items.length) + "/" + items.length;
  $("compte").textContent = jeu === "intrus" ? rang + "  ·  " + format(temps()) : "✓ " + bons + "  ·  " + rang;   // logo et star
}

function afficher() {
  verrou = false;
  tableau.className = "";
  $("nom").textContent = "";
  compteur();
  if (k >= items.length) {
    chrono(false); couperMicro();
    tableau.classList.add("fini");
    $("fin-score").textContent = jeu === "intrus" ? format(temps()) : bons + " / " + items.length;
    $("fin-question").textContent = jeu === "intrus" ? "Et toi, tu fais mieux\u00a0?" : "Et toi, t'as fait combien\u00a0?";
    $("compte").textContent = "Terminé";
    return;
  }
  if (jeu === "intrus") chrono(true);
  const it = items[k];
  if (aVoix()) return afficherVoix(it);
  if (jeu === "logo") {
    $("imgA").src = it.a; $("imgB").src = it.b;
    document.querySelectorAll(".choix").forEach(c => { c.className = "choix"; c.querySelector(".pastille")?.remove(); });
  } else {
    const g = $("grille"), n = it.n;
    g.style.gridTemplateColumns = g.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    let html = "";
    for (let l = 0; l < n; l++) for (let c = 0; c < n; c++) {
      const intrus = l === it.ligne && c === it.col;
      html += `<div data-i="${intrus ? 1 : 0}">${intrus ? it.intrus : it.fond}</div>`;
    }
    g.innerHTML = html;
    const cote = (g.clientWidth - 12) / n;
    g.querySelectorAll("div").forEach(d => d.style.fontSize = (cote * .78) + "px");
  }
}

function pastille(el, ok) { const p = document.createElement("span"); p.className = "pastille"; p.textContent = ok ? "✓" : "✗"; el.appendChild(p); }

function repondre(el, ok, bonEl, nom) {
  if (verrou) return;
  verrou = true;
  if (ok) bons++;
  el.classList.add(ok ? "bon" : "faux"); pastille(el, ok);
  if (!ok) { bonEl.classList.add("bon"); pastille(bonEl, true); }
  if (nom) $("nom").textContent = nom;
  tableau.classList.add("repondu");
  compteur();
  suite = setTimeout(() => { k++; afficher(); }, ok ? 1100 : 1700);
}

document.querySelectorAll(".choix").forEach(c => c.addEventListener("pointerdown", () => {
  const it = items[k]; if (!it || jeu !== "logo") return;
  repondre(c, c.dataset.c === it.bon, document.querySelector(`.choix[data-c="${it.bon}"]`), it.nom);
}));
$("grille").addEventListener("pointerdown", e => {
  const d = e.target.closest("#grille > div"); if (!d || !items[k] || verrou) return;
  if (d.dataset.i === "1") { chrono(false); return repondre(d, true); }
  // mauvaise case : elle tremble en rouge, +2 s, on continue de chercher
  cumul += PENALITE; compteur();
  d.classList.remove("faux"); void d.offsetWidth; d.classList.add("faux");
  d.querySelector(".pastille")?.remove(); pastille(d, false);
  $("nom").textContent = "+" + PENALITE / 1000 + " s"; tableau.classList.add("penalite");
  clearTimeout(d.efface); d.efface = setTimeout(() => { d.classList.remove("faux"); d.querySelector(".pastille")?.remove(); tableau.classList.remove("penalite"); }, 700);
});
tableau.addEventListener("pointerdown", () => { if (tableau.classList.contains("fini")) menu(); });
// jeux à la voix : toucher l'écran relance le micro s'il s'est coupé ;
// sans reconnaissance vocale (navigateur qui ne la gère pas), toucher la photo / les tuiles = trouvé
document.addEventListener("pointerdown", e => {
  if (!aVoix() || !document.body.classList.contains("en-jeu") || tableau.classList.contains("fini")) return;
  if (!SR) { if (e.target.closest("#star, #mot")) reveler(true); return; }
  refuse = false; micro();
});

function lancer() {
  items = jeu === "logo" ? LOGOS[manche].logos : jeu === "star" ? STARS[manche].stars : jeu === "mot" ? MOTS[manche].mots
    : jeu === "vf" ? questionsVF(LOGOS[manche].logos) : grillesIntrus({ taille: TAILLES[manche], paires: tirerPaires(8) });
  k = 0; bons = 0; cumul = 0; depuis = null;
  $("titre-jeu").textContent = { logo: "Trouve le bon logo", intrus: "Trouve l'intrus", star: "Retrouve la star", mot: "Retrouve le mot", vf: "Vrai ou faux logo ?" }[jeu];
  $("logos").style.display = jeu === "logo" ? "" : "none";
  $("grille").style.display = jeu === "intrus" ? "" : "none";
  ["star", "mot", "vf"].forEach(j => $(j).style.display = jeu === j ? "" : "none");
  document.body.classList.toggle("mode-intrus", jeu === "intrus");
  document.body.classList.toggle("voix", aVoix());
  document.body.classList.add("pret");
  if (aVoix()) micro();   // demande l'autorisation du micro maintenant, avant l'enregistrement d'écran
}
function menu() { clearTimeout(suite); clearTimeout(minuteQ); cancelAnimationFrame(barre); couperMicro(); chrono(false); document.body.classList.remove("en-jeu", "pret"); $("titre-jeu").textContent = ""; $("compte").textContent = ""; }

const AIDES = {
  star: "Dis le nom de la star à voix haute : la photo se retourne. « Je passe » pour passer.",
  mot: "Dis le mot à voix haute : les lettres se remettent dans l'ordre. « Je passe » pour passer.",
  vf: "Dis « vrai » ou « faux » (ou touche le bouton). Si c'était un faux, le vrai logo apparaît à côté.",
};
function choisirJeu(b) {
  jeu = b.dataset.jeu;
  document.querySelectorAll("#choix-jeu button, #choix-jeu2 button").forEach(x => x.classList.toggle("choisi", x === b));
  $("aide").style.display = aVoix() ? "none" : ""; $("aide-star").style.display = aVoix() ? "" : "none";
  $("choix-temps").style.display = aVoix() ? "" : "none";
  if (aVoix()) $("aide-star").innerHTML = (SR ? AIDES[jeu] : "⚠️ Ce navigateur ne reconnaît pas la voix (prends Safari sur iPhone, ou Chrome). Ici : touche la photo / les lettres quand tu as trouvé.")
    + "<br>Appui long sur le compteur en haut = retour au menu."
    + (jeu === "star" ? ' <a href="credits-photos.txt" style="color:#cfcfd6">Crédits photos</a>' : "");
}
["choix-jeu", "choix-jeu2"].forEach(id => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (b) choisirJeu(b); }));
$("choix-temps").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  TEMPS = +b.dataset.t; $("choix-temps").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); });
$("choix-manche").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  manche = +b.dataset.m; $("choix-manche").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); });
$("go").addEventListener("click", () => { camera(); lancer(); });
$("pret").addEventListener("pointerdown", () => { document.body.classList.remove("pret"); document.body.classList.add("en-jeu"); afficher(); });

// appui long sur le compteur = retour au menu (rien de visible à l'enregistrement)
let minuteur;
$("compte").addEventListener("pointerdown", () => { minuteur = setTimeout(menu, 700); });
["pointerup", "pointerleave", "pointercancel"].forEach(t => $("compte").addEventListener(t, () => clearTimeout(minuteur)));

camera();
tic();
</script>
</body>
</html>
